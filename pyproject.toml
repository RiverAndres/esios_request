[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esios_request"
dynamic = ["version"]
description = "Module to facilitate GET requests to the ESIOS public API."
readme = "README.md"
requires-python = ">=3.12"

authors = [
  { name = "RiverAndres", email = "riverandresf1@gmail.com" }
]

license = { text = "MIT" }

dependencies = [
  "requests>=2.32.3",
  "requests-cache>=1.3.1",
  "platformdirs>=4.0",
  "pandas>=2.2.3",
  "python-dateutil>=2.9.0",
  "tzdata>=2024.1",
  "urllib3>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11"
]

[tool.setuptools.dynamic]
version = { attr = "esios_request.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["esios_request*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
